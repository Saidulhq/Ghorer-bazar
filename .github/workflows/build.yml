name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle Action
      uses: gradle/actions/setup-gradle@v4

    - name: Build Android App
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        elif [ -f "Ghorer-bazar/gradlew" ]; then
          cd Ghorer-bazar
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "gradlew file not found"
          exit 1
        fi
